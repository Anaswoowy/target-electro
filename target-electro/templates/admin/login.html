<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الإدارة — Target Electro</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-shell">
  <div style="text-align:center;margin-bottom:20px;">
    <img src="{{ url_for('static', filename='img/logo-placeholder.svg') }}" style="height:36px;">
  </div>
  <div class="login-box">
    <h2 style="margin-top:0;text-align:center;">دخول الإدارة</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <div class="form-field"><label>اسم المستخدم</label><input type="text" name="username" required autofocus></div>
      <div class="form-field"><label>كلمة المرور</label><input type="password" name="password" required></div>
      <button type="submit" class="btn btn-red btn-block">دخول</button>
    </form>
  </div>
</div>
</body>
</html>
